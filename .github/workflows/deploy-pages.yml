name: Daily HN Digest

on:
  # Daily scheduling is handled by the Hermes guard so there is only one
  # generation run per day. Keeping both the GitHub schedule and the Hermes
  # dispatch was causing duplicate screenshot batches and frequent 429s.
  push:
    branches: [main]
  workflow_dispatch:  # Manual/Hermes trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install screenshot browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Remove old date format history folders
        run: |
          cd history 2>/dev/null && find . -maxdepth 1 -type d -regex './[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]' -exec rm -rf {} + || true

      - name: Generate digest
        run: python generate.py

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html screenshots/ history/ days.json
          git diff --cached --quiet || git commit -m "📰 Daily digest — $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
