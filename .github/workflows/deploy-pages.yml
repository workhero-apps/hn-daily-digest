name: Daily HN Digest

on:
  workflow_dispatch:
    inputs:
      digest_date:
        description: 'UTC date to recover (YYYY-MM-DD); leave empty for today'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install screenshot browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Remove old date format history folders
        run: |
          cd history 2>/dev/null && find . -maxdepth 1 -type d -regex './[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]' -exec rm -rf {} + || true

      - name: Generate digest
        env:
          HN_DIGEST_DATE: ${{ inputs.digest_date }}
        run: python generate.py

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html screenshots/ history/ days.json weeks/ weeks.json
          git diff --cached --quiet || git commit -m "📰 Daily digest — $(date -u +%Y-%m-%d)"
          git push
